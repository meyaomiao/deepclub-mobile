name: Mobile validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct the pinned adaptation
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/prepare.py --checkout .work/dsh-go
          git -C .work/dsh-go diff --check
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          source = Path('.work/dsh-go')
          expected = json.loads(Path('overlay/source-state.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', 'HEAD'], cwd=source)
          added = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z'], cwd=source)
          assert {p.decode() for p in (changed + added).split(b'\0') if p} == set(expected)
          for name, digest in expected.items():
              path = source / name
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              assert actual == digest, name
          print(f'Clean source reconstruction verified: {len(expected)} entries')
          PY
      - name: Install pinned Flutter
        env:
          FLUTTER_ARCHIVE_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
        run: |
          curl --fail --location --output "$RUNNER_TEMP/flutter.tar.xz" https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.7-stable.tar.xz
          echo "$FLUTTER_ARCHIVE_SHA256  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check -
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
      - name: Resolve the original dependency lock
        working-directory: .work/dsh-go/app
        run: flutter pub get --enforce-lockfile
      - name: Generate and verify localization
        working-directory: .work/dsh-go/app
        run: |
          python3 tool/l10n_merge.py
          python3 tool/l10n_merge.py --check
      - name: Analyze the complete application
        working-directory: .work/dsh-go/app
        run: flutter analyze --no-pub
      - name: Fetch pinned Noto CJK fonts for UI and icon checks
        env:
          FONT_SOURCE: https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTC
        run: |
          mkdir -p "$RUNNER_TEMP/noto-cjk"
          cd "$RUNNER_TEMP/noto-cjk"
          for weight in Light Regular Bold; do
            file="NotoSansCJK-${weight}.ttc"
            curl --fail --location --retry 3 --max-time 120 --output "$file" "$FONT_SOURCE/$file"
          done
          sha256sum --check <<'SUMS'
          872def437cf8b9c41bf1736da891e34a8c25b764c0c4a51418d3745570660f42  NotoSansCJK-Light.ttc
          b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  NotoSansCJK-Regular.ttc
          faa5f3656a78b2e2d450d27fe8382c778bc2b6bb5ea29c986664a6a435056ceb  NotoSansCJK-Bold.ttc
          SUMS
      - name: Verify account, preparation UI, icons and architecture
        working-directory: .work/dsh-go/app
        env:
          DSH_TEST_FONT_DIR: ${{ runner.temp }}/noto-cjk
        run: flutter test --no-pub test/deepclub test/deepclub_surface test/brand/site_update_test.dart test/icons/app_icons_test.dart test/arch/import_direction_test.dart
      - name: Keep icon golden comparison evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: icon-golden-failures
          path: .work/dsh-go/app/test/icons/failures/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Check local conversation viewer
        working-directory: .work/dsh-go
        run: |
          python3 app/tool/make_replay_viewer.py --check
          node --test app/test/deepclub_surface/replay_viewer_test.mjs
